<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StepByLearn</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0 auto;
        max-width: 44rem;
        padding: 2rem 1rem;
        line-height: 1.5;
      }
      code { background: rgba(127, 127, 127, 0.15); padding: 0 0.25rem; }
      .status { font-size: 0.9rem; opacity: 0.8; }
    </style>
  </head>
  <body>
    <h1>StepByLearn</h1>
    <p>
      Offline-first, hybrid-AI, step-by-step learning platform. This is a minimal
      placeholder shell; the JSON API is served under <code>/api</code>.
    </p>
    <p class="status" id="status">Checking engines…</p>

    <script>
      // Register the service worker so the shell is available offline.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }

      // Surface which AI engines are currently reachable.
      fetch("/api/engines")
        .then((r) => r.json())
        .then((data) => {
          const local = data.local_ollama ? "available" : "offline";
          const cloud = data.cloud_key_present ? "key set" : "no key";
          document.getElementById("status").textContent =
            `Local engine: ${local} · Cloud: ${cloud}`;
        })
        .catch(() => {
          document.getElementById("status").textContent =
            "API unreachable (are you running the server?).";
        });
    </script>
  </body>
</html>

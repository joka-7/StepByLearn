# Security scanning. Kept identical in shape across every repo in the
# portfolio so a finding means the same thing wherever it appears.
name: Security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: a secret removed in a later commit is still in the
          # pack, and still valid until it's rotated.
          fetch-depth: 0
      - name: gitleaks
        # The gitleaks CLI directly rather than gitleaks-action: the action
        # lists the PR's commits via the GitHub API, which 403s under the
        # default CI token permissions. A CLI scan needs no API access.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source=/repo --redact --verbose

  npm-dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Blocking: the backlog this was advisory for (4 high, 1 moderate) is
      # cleared and `npm audit` reports zero, so a new advisory should fail
      # here rather than be reported and ignored.
      - name: npm audit
        run: npm audit --audit-level=high

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # `.ai` and the per-tool skill trees are vendored ogen-ai config with
          # no dependency manifests of their own — scanning them finds nothing
          # and only slows the job.
          skip-dirs: ".ai,.agents,.claude,.cursor"
          format: table
          severity: HIGH,CRITICAL
          # Advisory alongside the dependency audits above: report findings in
          # the job log without failing until the backlog is cleared. SARIF
          # upload is deliberately omitted — it needs code scanning enabled,
          # which on a private repo requires GitHub Advanced Security.
          exit-code: 0
          scanners: vuln

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:${{ matrix.language }}"

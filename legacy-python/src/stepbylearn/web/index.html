<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StepByLearn</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">◆</span>
        <div>
          <h1>StepByLearn</h1>
          <p class="tagline">Offline-first, hybrid-AI learning paths</p>
        </div>
      </div>
      <div id="engine-status" class="badges" aria-live="polite">
        <span class="badge badge-muted">checking engines…</span>
      </div>
    </header>

    <main class="layout">
      <!-- Left column: create + list -->
      <section class="sidebar">
        <form id="generate-form" class="card">
          <h2>New path</h2>
          <label>
            Topic
            <input
              id="topic"
              type="text"
              placeholder="e.g. Rust ownership"
              required
            />
          </label>
          <label>
            Difficulty
            <select id="difficulty">
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </label>
          <button type="submit" id="generate-btn">Generate</button>
          <p id="generate-hint" class="hint"></p>
        </form>

        <div class="card">
          <h2>Your paths</h2>
          <ul id="path-list" class="path-list">
            <li class="empty">No paths yet.</li>
          </ul>
        </div>
      </section>

      <!-- Right column: detail -->
      <section id="detail" class="detail card">
        <div class="empty-detail">
          <p>Select a path, or generate a new one to get started.</p>
        </div>
      </section>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>

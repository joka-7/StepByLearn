[project]
name = "stepbylearn"
version = "0.1.0"
description = "Offline-first, hybrid-AI, step-by-step learning platform."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "StepByLearn" }]

dependencies = [
    # --- Web / API delivery ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # --- Domain validation & settings ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- Persistence (local-first SQLite) ---
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    # --- AI drivers ---
    "httpx>=0.28",
    "ollama>=0.4",
    "anthropic>=0.40",
    # --- Robust JSON repair from fragile local LLM output ---
    "json-repair>=0.30",
    # --- Secret handling ---
    "keyring>=25.5",
    "cryptography>=44.0",
    # --- Dates / scheduling ---
    "python-dateutil>=2.9",
]

[project.scripts]
stepbylearn = "stepbylearn.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "respx>=0.22",
    "freezegun>=1.5",
    "types-python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stepbylearn"]

# --- Tooling: PEP 8 + modern typing enforcement ---
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle (PEP 8)
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade -> forces `X | Y`, native generics
    "B",       # bugbear
    "D",       # pydocstyle -> enforce docstrings
    "ANN",     # flake8-annotations -> require type annotations
]
ignore = [
    "D203",  # conflicts with D211 (no blank line before class docstring)
    "D213",  # conflicts with D212 (multi-line summary on first line)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101"]
"src/stepbylearn/db/migrations/**" = ["D", "ANN", "E501", "I001", "W291"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["json_repair.*", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=stepbylearn --cov-report=term-missing"
